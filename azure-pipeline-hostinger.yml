trigger:
  branches:
    include:
      - dev

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'crm-frontend'
  registry: 'registry.nafabarter.com'
  fullImageName: '$(registry)/$(imageName)'
  tag: '$(Build.BuildId)'

steps:

- task: Docker@2
  displayName: 'Build and push $(imageName)'
  inputs:
    command: buildAndPush
    containerRegistry: 'nafa-registry'
    repository: '$(imageName)'
    Dockerfile: 'Dockerfile'
    tags: |
      latest
      $(tag)
    
- task: SSH@0
  displayName: 'Deploy CRM Frontend'
  inputs:
    sshEndpoint: 'hostinger-vps'
    runOptions: 'commands'
    commands: |
      cd /opt/crm-frontend
      export IMAGE_TAG=$(Build.BuildId)
      docker compose up -d   